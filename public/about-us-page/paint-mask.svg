<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 739" preserveAspectRatio="none">
  <defs>
    <!-- Rough, brushy edge: displace a soft-cornered shape with fractal noise -->
    <filter id="brush" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="44" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#brush)" fill="#fff">
    <rect x="30" y="34" width="355" height="671" rx="18"/>
    <!-- a few loose strokes past the edge, like a brush running out -->
    <rect x="18" y="120" width="40" height="180" rx="20"/>
    <rect x="360" y="420" width="38" height="200" rx="19"/>
    <rect x="90" y="20" width="200" height="34" rx="17"/>
    <rect x="140" y="690" width="210" height="34" rx="17"/>
  </g>
</svg>
